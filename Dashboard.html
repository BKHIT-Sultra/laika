    <script>
        // --- VARIABEL GLOBAL SDM & LAINNYA ---
        let sdmAllKegiatanData = [];
        let sdmCurrentPage = 1;
        const sdmItemsPerPage = 10;
        let sdmMasterPegawai = [];
        let sdmSelectedPesertaOnline = [];
        let sdmSelectedPesertaOnlineHybrid = [];
        let sdmSearchTimeout;
        let sdmCurrentCetakId = null;
        let sdmCurrentCetakBtn = null;
        let sdmFilteredData = [];
        
        let allRegulasiData = [];
        let currentPage = 1;
        const itemsPerPage = 10;

        let allPPIDData = [];
        let ppidCurrentPage = 1;

        let allAduanData = [];
        let aduanCurrentPage = 1;

        let allIKMData = [];
        let ikmCurrentPage = 1;

        let hapusTimestampTemp = null;

        // --- CEK SESSION SAAT MUAT HALAMAN ---
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                const isLoggedIn = localStorage.getItem('laika_logged_in');
                const loginTimestamp = localStorage.getItem('laika_login_timestamp');
                
                if (!isLoggedIn || isLoggedIn !== 'true' || !loginTimestamp) {
                    handleLogoutLocal(); return;
                }

                const ts = parseInt(loginTimestamp, 10);
                if (isNaN(ts) || Date.now() - ts > (60 * 60 * 1000)) { // 1 Jam
                    handleLogoutLocal(); return;
                }

                const username = localStorage.getItem('laika_username'); 
                if (username) {
                    try {
                        const result = await fetchGasAPI('cekLogin', { username: username, password: '' }); // Hack kecil jika Anda tidak menyimpan password
                        // Karena kita tidak menyimpan password di localStorage, lebih baik kita buat fungsi khusus di backend `ambilDataUser` jika diperlukan, 
                        // Tapi untuk amannya, mari gunakan data localStorage jika kita ubah backend nanti.
                        // UNTUK SEMENTARA: Kita biarkan saja dulu (dummy request atau perbaiki backend nanti)
                        
                        // KITA GUNAKAN LOCAL STORAGE SAJA SEMENTARA (jika Anda tidak punya API khusus GetUserData)
                        document.querySelector('.user-name-text').textContent = "Admin";
                        document.querySelector('.user-dropdown-header strong').textContent = "Admin";
                    } catch (e) {
                         console.warn('Gagal ambil user info', e);
                    }
                }

                switchView('dashboard');
            } catch (error) {
                handleLogoutLocal();
            }
        });

        function handleLogoutLocal() {
            localStorage.clear();
            window.top.location.replace("login.html");
        }

        function handleLogout() {
            handleLogoutLocal();
        }

        // --- FUNGSI NAVIGASI ---
        function switchView(viewName) {
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(m => m.classList.remove('active'));
            const target = document.getElementById('view-' + viewName);
            if (target) target.classList.add('active');
            const menu = document.getElementById('menu-' + viewName);
            if (menu) menu.classList.add('active');
            else {
                const parent = document.querySelector(`.dropdown-item[onclick="switchView('${viewName}')"]`);
                if (parent) parent.closest('.nav-item').classList.add('active');
            }
            if (viewName === 'dashboard') {
                loadStatistik();
                loadStatistikSDM();
                loadGrafikStatistik();
                loadAktivitasTerakhir();
                loadIKMSummaryOnly(); // Panggil fungsi khusus
            }
            if (viewName === 'regulasi') loadRegulasi();
            if (viewName === 'ppid') loadPPID();
            if (viewName === 'aduan') loadAduan();
            if (viewName === 'ikm') loadIKM();
            if (viewName === 'sdm') sdmLoadKegiatan();
        }

        // ==========================================
        // FETCH DATA MENGGUNAKAN fetchGasAPI
        // ==========================================

        async function loadStatistik() {
            try {
                const res = await fetchGasAPI('ambilStatistikDashboard');
                if(res.status === 'success') {
                    const d = res.data;
                    document.getElementById('totalRegulasi').textContent = d.totalRegulasi; 
                    document.getElementById('totalPPID').textContent = d.totalPPID; 
                    document.getElementById('totalAduan').textContent = d.totalAduan; 
                    document.getElementById('indeksIKM').textContent = d.indeksIKM;
                }
            } catch(e) { console.warn('Gagal load statistik', e); }
        }

        async function loadStatistikSDM() {
            try {
                const res = await fetchGasAPI('ambilStatistikSDM');
                if(res.status === 'success') {
                    document.getElementById('totalKegiatanSDM').textContent = res.data.totalKegiatan;
                    document.getElementById('totalSelesaiSDM').textContent = res.data.totalSelesai;
                }
            } catch(e) { console.warn('Gagal load statistik SDM', e); }
        }

        async function loadAktivitasTerakhir() {
            const c = document.getElementById('aktivitasTerakhirContainer');
            try {
                const res = await fetchGasAPI('ambilAktivitasTerakhir');
                if(res.status === 'success') {
                    const d = res.data;
                    if (!d || d.length === 0) { c.innerHTML = `<div class="activity-item"><div class="activity-icon" style="color:var(--text-muted);"><i class="fas fa-info-circle"></i></div><div><div class="activity-text">Belum ada aktivitas</div><div class="activity-time">-</div></div></div>`; return; }
                    c.innerHTML = d.map(i => `<div class="activity-item"><div class="activity-icon" style="color:${i.color};"><i class="fas ${i.icon}"></i></div><div><div class="activity-text">${i.text}</div><div class="activity-time">${i.time}</div></div></div>`).join('');
                }
            } catch(e) { console.warn('Gagal load aktivitas:', e); }
        }

        let myChart = null;
        async function loadGrafikStatistik() {
            try {
                const res = await fetchGasAPI('ambilStatistikGrafik');
                if(res.status === 'success') {
                    const d = res.data;
                    const canvas = document.getElementById('statistikChart');
                    const ctx = canvas.getContext('2d');
                    if (myChart) myChart.destroy();
                    // (Logika rendering Chart.js sama persis, abaikan modifikasinya karena panjang, copy paste saja isinya ke dalam kondisi ini)
                    // ... [ISI CHART JS ANDA] ...
                }
            } catch(e) { console.warn('Gagal load grafik:', e); }
        }

        async function loadIKMSummaryOnly() {
            try {
                const res = await fetchGasAPI('ambilIKM');
                if(res.status === 'success') {
                    const d = res.data;
                    if (d) {
                        document.getElementById('ikmIndeks').textContent = d.indeks || '0.0';
                        // Update DOM lainnya untuk dashboard utama...
                    }
                }
            } catch(e) {}
        }


        // --- MANAJEMEN REGULASI ---
        async function loadRegulasi() {
            try {
                const res = await fetchGasAPI('ambilRegulasi');
                if(res.status === 'success') {
                    allRegulasiData = res.data || [];
                    currentPage = 1;
                    renderRegulasi();
                } else throw new Error(res.message);
            } catch(e) {
                document.getElementById('regulasiTableBody').innerHTML = '<tr><td colspan="5" style="text-align:center; color:red;">Gagal memuat data dari server.</td></tr>';
            }
        }

        async function handleUpload(e) { 
            e.preventDefault(); 
            const btn = e.target.querySelector('.btn-submit');
            const originalText = btn.innerHTML; 
            
            const judul = document.getElementById('judulRegulasi').value;
            const kategori = document.getElementById('kategoriRegulasi').value;
            const deskripsi = document.getElementById('deskripsiRegulasi').value;
            const fileInput = document.getElementById('regulasiFile');

            if (!fileInput || fileInput.files.length === 0) { alert("Silakan pilih file."); return; }

            const file = fileInput.files[0];
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengupload...'; 
            btn.style.opacity = '0.8'; 

            const reader = new FileReader();
            reader.onload = async function(event) {
                try {
                    const res = await fetchGasAPI('simpanRegulasi', {
                        judul: judul, kategori: kategori, deskripsi: deskripsi, 
                        fileData: event.target.result, fileName: file.name
                    });
                    
                    if(res.status === 'success') {
                        btn.innerHTML = '<i class="fas fa-check"></i> Tersimpan!'; 
                        btn.style.background = '#4CAF50'; 
                        setTimeout(() => { 
                            closeModal('modalUploadRegulasi'); 
                            e.target.reset(); 
                            btn.innerHTML = originalText; btn.style.background = ''; btn.style.opacity = '1';
                            loadRegulasi(); 
                        }, 1500);
                    } else throw new Error(res.message);
                } catch (err) {
                    alert('Gagal mengupload: ' + err.message);
                    btn.innerHTML = originalText; btn.style.background = ''; btn.style.opacity = '1';
                }
            };
            reader.readAsDataURL(file); 
        }

        async function confirmHapusRegulasi() {
            if (!hapusTimestampTemp) return;
            const btn = document.querySelector('#modalHapusRegulasi .btn-danger');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menghapus...'; btn.disabled = true;

            try {
                const res = await fetchGasAPI('hapusRegulasi', { timestamp: hapusTimestampTemp });
                if(res.status === 'success') {
                    closeModal('modalHapusRegulasi'); hapusTimestampTemp = null; loadRegulasi(); 
                } else throw new Error(res.message);
            } catch(err) {
                alert('Gagal menghapus: ' + err.message);
            }
            btn.innerHTML = originalHTML; btn.disabled = false;
        }

        // --- MANAJEMEN PPID & ADUAN ---
        async function loadPPID() {
            try {
                const res = await fetchGasAPI('ambilSemuaPPID');
                if(res.status === 'success') {
                    allPPIDData = res.data || []; ppidCurrentPage = 1; renderPPID();
                } else throw new Error(res.message);
            } catch(e) {
                document.getElementById('ppidTableBody').innerHTML = '<tr><td colspan="8" style="text-align:center; color:red;">Gagal memuat data.</td></tr>';
            }
        }

        async function loadAduan() {
            try {
                const res = await fetchGasAPI('ambilAduan');
                if(res.status === 'success') {
                    allAduanData = res.data || []; aduanCurrentPage = 1; renderAduan();
                }
            } catch(e) {}
        }

        async function handleRespon(e) { 
            e.preventDefault(); 
            const btn = e.target.querySelector('.btn-submit');
            const o = btn.innerHTML; 
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengirim...'; btn.style.opacity = '0.8'; 
            
            try {
                const payload = {
                    id: document.getElementById('responId').value,
                    type: document.getElementById('responType').value,
                    status: document.getElementById('responStatus').value,
                    keterangan: document.getElementById('responKeterangan').value
                };
                
                const res = await fetchGasAPI('simpanRespon', payload);
                if(res.status === 'success') {
                    btn.innerHTML = '<i class="fas fa-check"></i> Terkirim!'; btn.style.background = '#4CAF50'; 
                    setTimeout(() => { 
                        closeModal('modalRespon'); btn.innerHTML = o; btn.style.background = ''; btn.style.opacity = '1';
                        if (payload.type === 'ppid') loadPPID(); else loadAduan(); 
                    }, 1200);
                } else throw new Error(res.message);
            } catch(err) {
                alert('Gagal: ' + err.message);
                btn.innerHTML = o; btn.style.background = ''; btn.style.opacity = '1';
            }
        }

        // --- MANAJEMEN IKM ---
        async function loadIKM() {
            try {
                const res = await fetchGasAPI('ambilDataIKMDetail');
                if(res.status === 'success') {
                    allIKMData = res.data || [];
                    // ... (logika ekstrak dropdown tahun tetap sama)
                    ikmCurrentPage = 1; renderIKMDetail();
                }
            } catch(e) { console.warn(e); }
        }

        // --- MANAJEMEN SDM ---
        async function sdmLoadKegiatan() {
            document.getElementById('sdm-sdmTableBody').innerHTML = '<tr><td colspan="7" style="text-align:center; color:#999; padding:40px 0;"><i class="fas fa-spinner fa-spin"></i> Sedang menarik data...</td></tr>';
            sdmLoadMasterPegawai(); 

            try {
                const res = await fetchGasAPI('ambilKegiatan');
                if(res.status === 'success') {
                    sdmAllKegiatanData = res.data.sort((a, b) => parseTanggal(b.tanggal) - parseTanggal(a.tanggal));
                    sdmCurrentPage = 1; sdmRenderTabel();
                } else throw new Error(res.message);
            } catch(err) {
                document.getElementById('sdm-sdmTableBody').innerHTML = `<tr><td colspan="7" style="text-align:center; color:red;">Gagal Memuat Data</td></tr>`;
            }
        }

        async function sdmLoadMasterPegawai() {
            try {
                const res = await fetchGasAPI('ambilMasterPegawai');
                if(res.status === 'success') {
                    sdmMasterPegawai = res.data;
                    sdmSetupSearch('sdm-inputCariPegawai', 'sdm-listHasilPencarian', 'sdmSelectedPesertaOnline');
                    sdmSetupSearch('sdm-inputCariPegawaiOnline', 'sdm-listHasilPencarianHybrid', 'sdmSelectedPesertaOnlineHybrid');
                }
            } catch(e) {}
        }

        async function sdmSimpanKegiatan(e) {
            e.preventDefault();
            // ... (validasi input tetap sama) ...
            const btn = document.getElementById('sdm-btnSimpan');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...'; btn.disabled = true;

            const payload = {
                tanggal: document.getElementById('sdm-sdmTanggal').value,
                // ... (seluruh mapping payload tetap sama) ...
                judul: document.getElementById('sdm-sdmJudul').value
            };

            try {
                const res = await fetchGasAPI('simpanKegiatan', payload);
                if(res.status === 'success') {
                    sdmTutupModal('sdm-modalTambahSDM'); sdmLoadKegiatan();
                } else throw new Error(res.message);
            } catch(err) {
                sdmTampilkanNotifikasi(err.message, 'error');
            }
            btn.innerHTML = 'Simpan Kegiatan'; btn.disabled = false;
        }

        // Terapkan pola `await fetchGasAPI` yang sama untuk:
        // - sdmSimpanEditKegiatan()
        // - sdmHapusKegiatanSDM()
        // - sdmSimpanPenyelesaian()
        // - sdmEksekusiCetakPDF() (Gunakan 'getDetailCetak')

        // (SEMUA LOGIKA RENDER (Tabel, Filter, GSAP, CSS, Helper Parse Status, dsb) BIARKAN UTUH)
    </script>
